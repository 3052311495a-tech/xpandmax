<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>XpandMax</title>
  <link rel="stylesheet" href="popup.css">
  <script src="monitor.js" defer></script>
  <script src="popup.js" defer></script>
</head>
<body>
  <h1>XpandMax</h1>
  <label class="setting">
    <span><strong>隐藏通知未读数字</strong><small>隐藏左侧「通知」图标上的数字角标</small></span>
    <input id="hide-notification-count" type="checkbox" role="switch" checked disabled>
  </label>
  <fieldset>
    <legend>沉浸式浏览</legend>
    <label class="setting">
      <span><strong>隐藏左侧导航</strong><small>收起主页、通知等入口，可随时从插件恢复</small></span>
      <input id="hide-left-sidebar" type="checkbox" role="switch" disabled>
    </label>
    <label class="setting">
      <span><strong>隐藏右侧栏</strong><small>隐藏搜索框、推荐内容和底部链接</small></span>
      <input id="hide-sidebar-recommendations" type="checkbox" role="switch" checked disabled>
    </label>
  </fieldset>
  <fieldset>
    <legend>帖子流速</legend>
    <label class="setting"><span><strong>显示流速徽章</strong><small>发布以来平均浏览量，不是最近一小时增量</small></span><input id="show-tweet-velocity" type="checkbox" role="switch" checked disabled></label>
    <form id="velocity-thresholds">
      <label>上升（浏览/小时）<input id="velocity-rising" type="number" min="0.01" step="any" value="1000" required></label>
      <label>爆款（浏览/小时）<input id="velocity-viral" type="number" min="0.01" step="any" value="10000" required></label>
      <button type="submit">保存阈值</button>
      <small>爆款阈值须大于上升阈值</small>
    </form>
  </fieldset>
  <fieldset>
    <legend>账号监控</legend>
    <form id="monitor-webhook">
      <label>Webhook（可选）
        <input id="monitor-webhook-url" type="url" inputmode="url" maxlength="2048" placeholder="粘贴 Webhook URL" autocomplete="off" spellcheck="false">
      </label>
      <label>Authorization（可选）
        <input id="monitor-webhook-auth" type="password" maxlength="4096" placeholder="粘贴 Authorization，如 Bearer …" autocomplete="off" spellcheck="false">
      </label>
      <button type="submit">保存 Webhook</button>
      <button id="monitor-webhook-auth-clear" type="button" hidden>清除密钥</button>
      <small>只保存在本机。加入或移出名单时向该地址 POST。Grok Bot 请粘贴例程面板里的 Webhook URL，以及 Authorization 的完整值（通常是 Bearer …）。留空地址则不发送。须为 HTTPS，不能含账号密码或片段，也不能指向 X。保存后不再显示密钥。</small>
    </form>
    <ul id="monitor-accounts" aria-label="监控名单"></ul>
    <p id="monitor-empty">还没有监控账号。在作者行点击「监控」即可加入。</p>
  </fieldset>
  <p id="status" role="status" aria-live="polite">正在读取设置…</p>
  <p><a href="translation-options.html" target="_blank" rel="noopener">简介翻译设置</a></p>
</body>
</html>
